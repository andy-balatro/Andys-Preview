[manifest]
version = "1.0"
dump_lua = true
priority = 0

# This manifest assumes the following release structure:
#
# Andys-Preview

[[patches]]
[patches.copy]
target = "globals.lua"
position = "append"
sources = [ 
  "InitSimulate.lua",
  "InitPreview.lua"
]

[[patches]]
[patches.copy]
target = "main.lua"
position = "append"
sources = [
  "CorePreview.lua",
  "UtilsPreview.lua"
]

[[patches]]
[patches.copy]
target = "functions/common_events.lua"
position = "append"
sources = [
  "EngineSimulate.lua",
  "UtilsSimulate.lua"
]

[[patches]]
[patches.copy]
target = "card.lua"
position = "append"
sources = [
  "Jokers/_Vanilla.lua",
  "Jokers/Multiplayer.lua"
]

[[patches]]
[patches.copy]
target = "functions/UI_definitions.lua"
position = "append"
sources = [ "InterfacePreview.lua" ]

# Toggle for the Calculate Score button in the Game tab of the settings menu.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "G.F_CRASH_REPORTS and create_toggle({label = localize('b_set_crash_reports'), ref_table = G.SETTINGS, ref_value = 'crashreports', info = localize('ml_crash_report_info')}) or nil,"
position = "before"
payload = '''
FN and FN.PRE and G.SETTINGS.FN and create_toggle({label = "Show Calculate Score Button", ref_table = G.SETTINGS.FN, ref_value = 'show_calculate_button', callback = FN.PRE.calculate_button_toggle_callback}) or nil,
'''
match_indent = true
